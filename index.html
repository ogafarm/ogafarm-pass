<div style="padding:20px; font-family:sans-serif;">
  <h2>年間パス 会員証</h2>

  <input id="tel" type="text" placeholder="電話番号（ハイフンなし）"
    style="padding:10px; width:100%; font-size:16px;">

  <button onclick="issue()"
    style="margin-top:15px; padding:12px 20px; font-size:16px;
    background:#4CAF50; color:white; border:none; border-radius:6px;">
    会員証を発行する
  </button>

  <p id="msg" style="margin-top:20px; color:red;"></p>
</div>

<script>
async function issue() {
 const telParam = encodeURIComponent(tel);
const url = "https://script.google.com/macros/s/AKfycbwRtJVxyxg8g1-_1wwE9NLOa4DvwUklrjaXd2uwReGd3Y_c4vVIknIZwyq3VYO_mI91/exec?tel=" + telParam;

  const res = await fetch(url);
  const data = await res.json();

  if (!data.found) {
    document.getElementById("msg").innerText = "該当する購入情報がありません。";
    return;
  }

  // 会員証ページへ遷移
 // 会員証ページへ遷移（修正版）
const id = encodeURIComponent(data.id || "");
const exp = encodeURIComponent(data.exp || "");

console.log("Apps Script response:", data);
console.log("Redirecting to card with id, exp:", id, exp);

window.location.href =
  "https://ogafarm.github.io/ogafarm-pass/card.html?id=" + id + "&exp=" + exp;



}
</script>
