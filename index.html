<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>年間パス 発行（Issueページ）</title>
<style>
  body { font-family: sans-serif; padding:20px; max-width:520px; margin:auto; }
  input { padding:10px; width:100%; font-size:16px; box-sizing:border-box; }
  button { margin-top:15px; padding:12px 20px; font-size:16px; background:#4CAF50; color:#fff; border:none; border-radius:6px; cursor:pointer; }
  #msg { margin-top:16px; color:#c00; }
  .hint { margin-top:8px; color:#666; font-size:13px; }
</style>
</head>
<body>

<h3>年間パス 会員証発行</h3>

<input id="tel" type="text" placeholder="電話番号（ハイフンなし）" autocomplete="tel" inputmode="numeric">
<button id="issueBtn">会員証を発行する</button>
<p id="msg"></p>
<p class="hint">※電話番号はハイフン無しの半角数字で入力してください。</p>

<script>
document.getElementById("issueBtn").addEventListener("click", issue);

async function issue() {
  const msgEl = document.getElementById("msg");
  msgEl.innerText = "";

  const telRaw = document.getElementById("tel").value || "";
  const telTrim = telRaw.trim();

  if (!telTrim) {
    msgEl.innerText = "電話番号を入力してください。";
    return;
  }

  // 電話番号を数字だけに正規化してエンコード（ハイフンや空白が入っても大丈夫）
  const telNormalized = telTrim.replace(/\D/g, "");
  const telParam = encodeURIComponent(telNormalized);

  // --- あなたの Apps Script デプロイ URL（末尾に ?tel= を付けずに） ---
  const DEPLOY_BASE = "https://script.google.com/macros/s/AKfycbwRtJVxyxg8g1-_1wwE9NLOa4DvwUklrjaXd2uwReGd3Y_c4vVIknIZwyq3VYO_mI91/exec";
  const scriptUrl = DEPLOY_BASE + "?tel=" + telParam;
  // -----------------------------------------------------------------------

  try {
    console.log("Fetching:", scriptUrl);
    const res = await fetch(scriptUrl, { cache: "no-store" });
    if (!res.ok) {
      throw new Error("サーバーエラー: " + res.status);
    }

    const data = await res.json();
    console.log("Apps Script response:", data);

    // Apps Script が {found:true, id:..., exp:...} を返す想定
    if (!data || !data.found) {
      msgEl.innerText = "該当する購入情報がありません。";
      return;
    }

    // id と exp を安全にエンコードして遷移
    const id = encodeURIComponent(data.id || "");
    const exp = encodeURIComponent(data.exp || "");

    // GitHub Pages の公開 URL に遷移（必ず github.io を使う）
    const cardUrl = "https://ogafarm.github.io/ogafarm-pass/card.html?id=" + id + "&exp=" + exp;
    console.log("Redirecting to:", cardUrl);

    // 同一タブで遷移
    window.location.href = cardUrl;

  } catch (err) {
    console.error(err);
    msgEl.innerText = "通信エラーが発生しました。コンソールを確認してください。";
  }
}
</script>

</body>
</html>
